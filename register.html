<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - MaliMart</title>
    <link rel="stylesheet" href="CSS/register.css">
</head>
<body>
 <form action="">
  <legend><u>Become a VIP Member!</u></legend>

  <br><br><br>

  <label for="fullname">Full Name : </label>
  <input type="text" id="fullname" placeholder="e.g Jane Doe" required>
  
  <br><br><br>

  <label for="emailaddress">Email Address : </label>
  <input type="email" id="emailaddress" placeholder="e.g @janedoe123@gmail.com" required>

  <br><br><br>

  <label for="password">Password : </label>
  <input type="password" id="password" placeholder="e.g 1234567" required>

  <br><br><br>

  <label for="phone">Phone Number : </label>
  <input type="tel" id="phone" placeholder="e.g 07123456" required> 

  <br><br><br>

  <label for="dob">Date of Birth : </label>
  <input type="date" id="dob" required>
  
  <br><br><br>

  <label for="pct">Preffered Calling Time : </label>
  <input type="datetime-local" id="pct" required> 

  <br><br><br>

  <label for="upload">Upload File : </label>
  <input type="file" id="upload" required> 

  <br><br><br>

  <button>REGISTER</button>


 



 </form>
    









</body>
</html>
